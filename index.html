<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<style>
/* ===== MY DAILY 공통 디자인 규칙 (Calendar 기준 · Workout · Money 동일) =====
   글꼴 Pretendard 16px / 맨 위 앱 이름 / 하단 탭(이모지+이름) / 카드 둥글기 16 · 버튼·입력창 둥글기 12 · 높이 48
   알림 = 위쪽 알약 / 팝업 = 아래에서 올라오는 시트(둥글기 20) / 설정 = 메뉴 → 세부 화면
   색은 앱마다 다름: 아래 :root 변수만 바꾸면 됩니다. ===== */
:root{--g:#7685a2;--gd:#576684;--gl:#e9ecf2;--tx:#333;--mu:#888;--bg:#f7f7f8;--ln:#e3e5e8;--rd:#c0564b;--sf:#fff;--rdl:#fbeceb;--on:#fff;--cb:#c5c9d2;--tt:#333;--tb:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--g:#8c9fc4;--gd:#abbad9;--gl:#242c3d;--tx:#ececec;--mu:#a0a0a0;--bg:#121417;--ln:#2f333c;--rd:#e8857a;--sf:#1b1d22;--rdl:#3a2422;--on:#101316;--cb:#4a4f5a;--tt:#ececec;--tb:#101316;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
:root{--clr:0px}
@media all and (display-mode:standalone){@supports(-webkit-touch-callout:none){:root{--clr:28px}}}
#main{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--clr));left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(14px,calc((100vw - 720px)/2)) 24px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + var(--clr));background:var(--bg);z-index:6}
h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--gd)}h2{margin:0;font-size:16px}h3{margin:0 0 12px}
p{margin:0;overflow-wrap:anywhere}small,.muted{color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.top{margin-bottom:14px}.top .d{font-size:18px;font-weight:600;margin-top:6px}
.card{background:var(--sf);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.hd div{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--g);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}.btn.ghost{background:var(--gl);color:var(--gd)}.btn.danger{background:var(--rdl);color:var(--rd)}
.btn.full{width:100%;margin-top:8px}
.bar{height:10px;background:var(--gl);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.stats{display:flex;justify-content:space-between;align-items:baseline}.stats b{font-size:26px;color:var(--gd)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.li:first-of-type{border-top:0}
.li .g{flex:1;min-width:0;cursor:pointer}.li.done .g p{text-decoration:line-through;color:var(--mu)}
.time{min-width:48px;font-weight:600;color:var(--gd);font-size:14px}
.cb{flex:none;width:30px;height:30px;border:2px solid var(--cb);border-radius:9px;background:var(--sf);position:relative;cursor:pointer;padding:0}
.cb.on{background:var(--g);border-color:var(--g)}.cb.on:after{content:'';position:absolute;left:9px;top:3px;width:7px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ic{flex:none;width:40px;height:40px;border:0;background:none;font-size:17px;color:var(--mu);cursor:pointer}
.pri{font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;background:var(--gl);color:var(--gd)}.pri.high{background:var(--rdl);color:var(--rd)}
.empty{color:var(--mu);text-align:center;padding:14px 0;font-size:14px}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:6px}.nav2 b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid>span{font-size:12px;color:var(--mu);padding:4px 0}
.day{aspect-ratio:1;max-height:56px;border:0;background:none;border-radius:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day.today{color:var(--gd);font-weight:700;background:var(--gl)}.day.sel{background:var(--g);color:var(--on)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--g)}.dots i.t{background:#e0a458}.day.sel .dots i{background:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip input{display:none}.chip span{display:block;min-width:40px;text-align:center;padding:8px 0;border-radius:10px;background:var(--gl);color:var(--gd)}.chip input:checked+span{background:var(--g);color:var(--on)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:20px;color:var(--mu);display:flex;flex-direction:column;align-items:center;cursor:pointer}
nav button span{font-size:11px;margin-top:1px}nav button.on{color:var(--gd);font-weight:700}
#modal.open{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);color:var(--tx);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){#modal.open{align-items:center}.sheet{border-radius:20px}}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input[type=text],input[type=date],input[type=time],select,textarea{display:block;width:100%;min-height:48px;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:12px;font:inherit;font-size:16px;color:var(--tx);background:var(--sf)}
textarea{min-height:80px}.frow{display:flex;gap:8px;margin-top:6px}.frow .btn{flex:1}
.chk{display:flex!important;align-items:center;gap:8px;color:var(--tx);font-size:15px}.chk input{width:22px;height:22px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px) + var(--clr));transform:translateX(-50%);background:var(--tt);color:var(--tb);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.show{opacity:.95}#toast.err{background:var(--rd);color:#fff}

.sheet{overflow-x:hidden}.sheet form,.sheet label{min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;width:100%;max-width:100%;min-width:0;height:48px;line-height:28px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}

.hd div{align-items:center}
.dots i.n{background:#8aa4d6}
.strip{display:flex;position:relative;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 calc(100%/7);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:2px solid transparent;border-radius:14px;text-align:center}
.sd small{font-size:12px}.sd b{font-size:17px}.sd em{font-style:normal;font-size:14px;font-weight:700;color:var(--gd);min-height:21px}
.sd.today{border-color:var(--g);background:var(--gl)}
#note{min-height:120px}

.memo{white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;line-height:1.6}
.rt .stats b{font-size:23px}
form textarea[name=text]{min-height:150px}
.strip{margin-bottom:6px}

/* 설정 메뉴: 항목을 누르면 세부 화면이 열림 */
.btn.back{display:block;margin-bottom:12px}
.menu{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:16px 44px 16px 16px;margin-bottom:10px;border-radius:12px;min-height:76px;position:relative;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.menu b{font-size:17px}
.menu small{color:var(--mu);font-size:14px;margin-top:2px;font-weight:400}
.menu i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:26px;color:var(--mu)}

/* ---- Workout 전용(통계·종목 수정·복원 창) ---- */
.top .d+small,.top small{display:block}
.sl{display:block;color:var(--mu);font-size:14px}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.srow input{flex:1;min-width:0}
.srow .sn{min-width:44px;color:var(--mu);font-size:14px}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hint{color:var(--mu);font-size:13px;margin-top:10px}
.sh{font-size:20px;margin:0}
button:not([class]){border:0;background:var(--gl);color:var(--gd);border-radius:12px;min-height:48px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.md{background:var(--sf);color:var(--tx);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:20px}}
.md p{margin:0 0 16px}
.md .acts{margin:0;justify-content:flex-end}
.md.w{max-width:560px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1;min-width:120px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--gl);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;color:var(--gd)}
.sum span{font-size:13px;color:var(--mu)}
.ysel{width:auto;min-height:44px;border:0;background:var(--gl);border-radius:12px;padding:6px 14px;font-weight:600;color:var(--gd)}
.imperr{color:var(--rd);background:var(--rdl);padding:8px 12px;border-radius:12px;margin:10px 0;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;height:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.opt small{display:block;color:var(--mu);font-weight:400;margin-top:2px}
.opt b{font-size:16px}
textarea{width:100%;min-height:120px;margin-top:8px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);font:13px/1.4 monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{min-height:44px;border-radius:999px;padding:6px 16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--g);color:var(--on);border-color:var(--g);font-weight:600}
.xi{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.xi span{flex:1;min-width:0;overflow-wrap:anywhere}
.xi button{min-width:64px;min-height:44px}
.gt{font-size:16px;font-weight:700;margin:18px 0 8px}
.chcard{padding:14px 12px 10px}
.ch{display:flex;gap:6px;padding-top:18px}
.chy{position:relative;width:28px;height:180px;flex:none}
.chy span{position:absolute;right:0;transform:translateY(50%);font-size:12px;color:var(--mu);line-height:1}
.chp{position:relative;flex:1;height:180px;border-left:1px solid var(--mu);border-bottom:1px solid var(--mu)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}
.chb{position:absolute;inset:0;display:flex}
.chc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.cbar{width:62%;max-width:34px;background:var(--g);border-radius:4px 4px 0 0}
.cv{font-size:12px;font-weight:700;color:var(--gd);margin-bottom:2px;line-height:1.2}
.cv.z{color:var(--mu);font-weight:500}
.chx{display:flex;margin-left:34px;margin-top:6px}
.chx>div{flex:1;text-align:center;font-size:12px;min-width:0}
.chx small{display:block;font-size:10px;color:var(--mu);overflow-wrap:anywhere;line-height:1.2}
.ft{display:flex;gap:8px;margin-top:12px}
.ft div{flex:1;background:var(--gl);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--mu)}
.ft b{display:block;font-size:20px;color:var(--gd)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px) + var(--clr));transform:translateX(-50%);background:var(--tt);color:var(--tb);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:40;max-width:90%;opacity:.95}
.toast.err{background:var(--rd);color:#fff}
.menu .sh{}

</style>

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);

const GROUPS={
 "가슴":["벤치 프레스","인클라인 벤치 프레스","체스트 프레스","덤벨 플라이","케이블 크로스오버"],
 "등":["랫풀다운","시티드 로우","바벨 로우","덤벨 로우","풀업"],
 "어깨":["숄더 프레스","사이드 레터럴 레이즈","프론트 레이즈","리어 델트 플라이"],
 "하체":["스쿼트","레그 프레스","레그 익스텐션","레그 컬","런지","힙 쓰러스트","루마니안 데드리프트"],
 "팔":["바이셉 컬","해머 컬","트라이셉 푸시다운","오버헤드 트라이셉 익스텐션"],
 "복근 및 유산소":["크런치","레그 레이즈","플랭크","러닝머신","실내 자전거","일립티컬"]
};
const DOW=["월","화","수","목","금","토","일"],SUN=["일","월","화","수","목","금","토"],VER="2.0";
const RK="workout-records-v1", CK="workout-custom-v1", GK="workout-groups-v1", CG="내가 추가한 운동";
let memStore={};
function lsGet(k,d){try{const v=localStorage.getItem(k);if(v===null)return memStore[k]!==undefined?memStore[k]:d;try{return JSON.parse(v)}catch(e){return d}}catch(e){return memStore[k]!==undefined?memStore[k]:d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){memStore[k]=v;return false}}

// 시작할 때 저장 상태를 점검한다. 읽기만 하며, 손상된 원본은 지우지 않고 별도 키에 복사해 둔다.
const loadInfo={rec:false,grp:false,corrupt:false};
function rawState(k,isObj){
 try{
  const v=localStorage.getItem(k);
  if(v===null)return "missing";
  const o=JSON.parse(v);
  if(!o||typeof o!=="object"||(isObj&&Array.isArray(o)))throw new SyntaxError("type");
  return "ok";
 }catch(e){
  if(e instanceof SyntaxError){try{if(localStorage.getItem(k+"-corrupt")===null)localStorage.setItem(k+"-corrupt",localStorage.getItem(k))}catch(_){}loadInfo.corrupt=true;return "corrupt"}
  return "missing";
 }
}
loadInfo.rec=rawState(RK,true)!=="ok";
loadInfo.grp=rawState(GK,true)!=="ok";
const IDB={
 open(){return new Promise(res=>{try{const r=indexedDB.open("workout-db",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv")};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
 get(db,k){return new Promise(res=>{try{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 set(db,k,v){return new Promise(res=>{try{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
};
let idb=null;
function mirror(){if(idb)IDB.set(idb,"snapshot",{records:lsGet(RK,{}),groups:lsGet(GK,null),savedAt:Date.now()})}
function saveKey(k,v){
 const ok=lsSet(k,v);
 let rb=false;try{rb=localStorage.getItem(k)===JSON.stringify(v)}catch(e){}
 try{localStorage.setItem("workout-saved-at",String(Date.now()))}catch(e){}
 mirror();
 return ok&&rb;
}
async function probe(){
 const o={ls:false,idb:false,persisted:null,standalone:false,framed:false};
 try{localStorage.setItem("__wl_test","1");o.ls=localStorage.getItem("__wl_test")==="1";localStorage.removeItem("__wl_test")}catch(e){}
 try{const db=idb||await IDB.open();if(db){await IDB.set(db,"__test",Date.now());o.idb=(await IDB.get(db,"__test"))!==undefined}}catch(e){}
 try{o.persisted=(navigator.storage&&navigator.storage.persisted)?await navigator.storage.persisted():null}catch(e){}
 o.standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
 try{o.framed=window.top!==window.self}catch(e){o.framed=true}
 return o;
}
async function saveFile(filename,text){
 try{const dl=(window.claude&&claude.use)?await claude.use("downloads"):null;if(dl){await dl.save({filename,data:text});return "ok"}}catch(e){if(e&&e.code==="declined")return "declined"}
 try{
  const f=new File([text],filename,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return "ok"}
 }catch(e){if(e&&e.name==="AbortError")return "declined"}
 try{
  const u=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return "link";
 }catch(e){}
 return "fail";
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){
  try{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();const ok=document.execCommand("copy");x.remove();return ok}catch(_){return false}
 }
}
function buildGroups(saved){
 const g={};
 Object.keys(GROUPS).forEach(k=>{g[k]=Array.isArray(saved[k])?saved[k].filter(n=>typeof n==="string"):[...GROUPS[k]]});
 Object.keys(saved).forEach(k=>{if(!(k in g)&&Array.isArray(saved[k]))g[k]=saved[k].filter(n=>typeof n==="string")});
 if(!g[CG])g[CG]=[];
 return g;
}
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const todayKey=()=>{const t=new Date();return keyOf(t.getFullYear(),t.getMonth(),t.getDate())};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
let uid=0;
const newRow=()=>({id:Date.now()+"-"+(uid++),name:"",reps:"",sets:"",weight:"",memo:"",adding:false,draft:""});
const intOnly=v=>v.replace(/\D/g,"").slice(0,4);
const decOnly=v=>{let s=v.replace(/[^\d.]/g,"");const i=s.indexOf(".");if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,"");return s.slice(0,7)};
const keyToLabel=k=>{const [y,m,d]=k.split("-").map(Number);return y+"년 "+m+"월 "+d+"일 ("+DOW[(new Date(y,m-1,d).getDay()+6)%7]+")"};
const shiftKey=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const t=new Date(y,m-1,d+n);return keyOf(t.getFullYear(),t.getMonth(),t.getDate())};

const repsArr=r=>Array.isArray(r.setReps)&&r.setReps.length?r.setReps.map(String):(num(r.sets)>0?Array(Math.min(Math.round(num(r.sets)),99)).fill(String(r.reps==null?"":r.reps)):[]);
const weightsArr=r=>{const n=repsArr(r).length;return Array.isArray(r.setWeights)&&r.setWeights.length===n?r.setWeights.map(String):Array(n).fill(r.weight?String(r.weight):"")};
const repsTotal=r=>Array.isArray(r.setReps)&&r.setReps.length?r.setReps.reduce((a,v)=>a+num(v),0):num(r.sets)*num(r.reps);

const ymd=k=>{const [y,m,d]=k.split("-").map(Number);return y+"년 "+m+"월 "+d+"일"};
const norm=s=>s.trim().replace(/\s+/g," ");
const findName=(gs,name)=>{const k=name.toLowerCase();for(const g of Object.keys(gs))if(gs[g].some(n=>n.toLowerCase()===k))return g;return null};
const filled=v=>v!==undefined&&v!==null&&String(v)!=="";

function parseBackup(text){
 let o;try{o=JSON.parse(text)}catch(e){return{error:"JSON 형식이 아닌 파일입니다."}}
 const bad=m=>({error:m});
 if(!o||typeof o!=="object"||Array.isArray(o)||!o.records||typeof o.records!=="object"||Array.isArray(o.records))return bad("Workout 백업 파일이 아닙니다.");
 const str=x=>x==null?"":String(x);
 const recs={};let days=0,ex=0;
 for(const k of Object.keys(o.records)){
  const [y,m,d]=k.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||dt.getMonth()!==m-1||dt.getDate()!==d)return bad("날짜 형식이 올바르지 않습니다: "+k+".");
  const v=o.records[k];
  if(!Array.isArray(v))return bad(k+" 기록의 형식이 올바르지 않습니다.");
  if(!v.length)continue;
  const ids=new Set();const norm=[];
  for(const it of v){
   if(!it||typeof it!=="object")return bad(k+" 기록의 형식이 올바르지 않습니다.");
   const name=str(it.name).trim();
   if(!name)return bad(k+" 기록에 운동 종목 이름이 없는 항목이 있습니다.");
   const reps=str(it.reps),sets=str(it.sets),weight=str(it.weight);
   if(!/^\d{0,4}$/.test(reps)||!/^\d{0,4}$/.test(sets)||!/^\d*\.?\d*$/.test(weight))return bad(k+" 기록에 올바르지 않은 숫자 값이 있습니다.");
   let sr=null;if(Array.isArray(it.setReps)&&it.setReps.length&&it.setReps.length<100&&it.setReps.every(x=>/^\d{1,4}$/.test(str(x))))sr=it.setReps.map(str);
   let sw=null;if(sr&&Array.isArray(it.setWeights)&&it.setWeights.length===sr.length&&it.setWeights.every(x=>/^\d{0,7}\.?\d{0,3}$/.test(str(x))))sw=it.setWeights.map(str);
   let id=str(it.id);if(!id||ids.has(id))id=Date.now()+"-"+(uid++);ids.add(id);
   norm.push(sr?{id,name,reps,sets,weight,memo:str(it.memo),setReps:sr,...(sw?{setWeights:sw}:{})}:{id,name,reps,sets,weight,memo:str(it.memo)});
  }
  recs[k]=norm;days++;ex+=norm.length;
 }
 if(!days)return bad("복원할 운동기록이 없습니다.");
 const customs=Array.isArray(o.customExercises)?o.customExercises.filter(s=>typeof s==="string"&&s.trim()).map(s=>s.trim().slice(0,30)):[];
 let eg=null;
 if(o.exerciseGroups!==undefined){
  const x=o.exerciseGroups;
  if(!x||typeof x!=="object"||Array.isArray(x))return bad("운동 종목 설정의 형식이 올바르지 않습니다.");
  eg={};
  for(const gk of Object.keys(x)){
   if(!Array.isArray(x[gk])||x[gk].some(n=>typeof n!=="string"))return bad("운동 종목 설정의 형식이 올바르지 않습니다.");
   eg[gk]=x[gk].map(norm).filter(Boolean).slice(0,200);
  }
 }
 return{records:recs,customs,eg,days,ex,exportedAt:o.exportedAt};
}


function BarChart({items}){
 const maxV=Math.max(0,...items.map(i=>i.v));
 const step=maxV<=4?1:maxV<=10?2:5;
 const top=Math.max(Math.ceil(maxV/step)*step,step*3);
 const ticks=[];for(let t=0;t<=top;t+=step)ticks.push(t);
 return html`<div>
  <div class="ch">
   <div class="chy">${ticks.map(t=>html`<span key=${t} style=${{bottom:(t/top*100)+"%"}}>${t}</span>`)}</div>
   <div class="chp">
    ${ticks.map(t=>html`<i class="gl" key=${t} style=${{bottom:(t/top*100)+"%"}}></i>`)}
    <div class="chb">${items.map((it,i)=>html`<div class="chc" key=${i}>
     <span class=${"cv"+(it.v?"":" z")}>${it.v}</span>
     <div class="cbar" style=${{height:(it.v/top*100)+"%"}}></div>
    </div>`)}</div>
   </div>
  </div>
  <div class="chx">${items.map((it,i)=>html`<div key=${i}><span>${it.l}</span>${it.s&&html`<small>${it.s}</small>`}</div>`)}</div>
 </div>`;
}

function StatsView({records}){
 const now=new Date();
 const years=[...new Set(Object.keys(records).filter(k=>records[k]&&records[k].length).map(k=>+k.slice(0,4)))].sort((a,b)=>a-b);
 const list=years.length?years:[now.getFullYear()];
 const [yr,setYr]=useState(list.includes(now.getFullYear())?now.getFullYear():list[list.length-1]);
 const [mo,setMo]=useState(now.getMonth());
 const Y=list.includes(yr)?yr:list[list.length-1];
 const yearHas=years.includes(Y);
 const M=Array.from({length:12},()=>({d:0,s:0,r:0}));const ex={};
 Object.keys(records).forEach(k=>{
  const rec=records[k];
  if(!rec||!rec.length||+k.slice(0,4)!==Y)return;
  const m=+k.slice(5,7)-1;M[m].d++;
  rec.forEach(r=>{M[m].s+=num(r.sets);M[m].r+=repsTotal(r);ex[r.name]=(ex[r.name]||0)+1});
 });
 const tot=M.reduce((a,x)=>({d:a.d+x.d,s:a.s+x.s,r:a.r+x.r}),{d:0,s:0,r:0});
 const lead=(new Date(Y,mo,1).getDay()+6)%7;
 const dim=new Date(Y,mo+1,0).getDate();
 const nw=Math.ceil((lead+dim)/7);
 const weeks=[];
 for(let w=0;w<nw;w++){
  const s=Math.max(1,w*7-lead+1),e=Math.min(dim,(w+1)*7-lead);
  let c=0;for(let d=s;d<=e;d++){const rec=records[keyOf(Y,mo,d)];if(rec&&rec.length)c++}
  weeks.push({l:(w+1)+"주 차",s:(mo+1)+"/"+s+"~"+(mo+1)+"/"+e,v:c});
 }
 const wTot=weeks.reduce((a,w)=>a+w.v,0);
 const exList=Object.entries(ex).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
 return html`<div>
  <div class="sbar" style=${{justifyContent:"flex-end"}}>
   <select class="ysel" value=${Y} onChange=${e=>setYr(+e.target.value)} aria-label="연도 선택">${list.map(y=>html`<option key=${y} value=${y}>${y}년</option>`)}</select>
  </div>
  ${!yearHas?html`<div class="card empty">해당 연도에 기록된 운동기록이 없습니다.</div>`:html`<div>
   <div class="card"><div class="sum">
    <div><b>${tot.d}</b><span>운동 일수</span></div>
    <div><b>${tot.s}</b><span>총 세트 수</span></div>
    <div><b>${tot.r}</b><span>총 반복 횟수</span></div>
   </div></div>
   <div class="gt">월별 운동 일수</div>
   <div class="card chcard"><${BarChart} items=${M.map((x,i)=>({l:(i+1)+"월",v:x.d}))}/></div>
   <div class="sbar" style=${{marginTop:"18px"}}>
    <div class="gt" style=${{margin:0}}>월별 주간 운동 횟수</div>
    <select class="ysel" value=${mo} onChange=${e=>setMo(+e.target.value)} aria-label="월 선택">${Array.from({length:12},(_,i)=>html`<option key=${i} value=${i}>${Y}년 ${i+1}월</option>`)}</select>
   </div>
   <div class="card chcard" style=${{marginTop:"8px"}}>
    <${BarChart} items=${weeks}/>
    <div class="ft">
     <div><b>${wTot}일</b>${mo+1}월 총 운동 일수</div>
     <div><b>${(wTot/weeks.length).toFixed(1)}일</b>주간 평균 운동 일수</div>
    </div>
   </div>
  </div>`}
 </div>`;
}

function ExerciseScreen({groups,saveGroups,records,back,flash,confirm}){
 const names=Object.keys(groups);
 const [g,setG]=useState(names[0]);
 const [im,setIm]=useState(null);
 const list=groups[g]||[];
 const usedDays=n=>Object.keys(records).filter(k=>(records[k]||[]).some(r=>r.name===n)).length;
 const dup=(name,self)=>{const f=findName(groups,name);return f&&(!self||name.toLowerCase()!==self.toLowerCase())?"이미 ‘"+f+"’ 목록에 같은 이름의 운동이 있습니다.":null};
 const add=name=>{
  if(!name)return "운동 이름을 입력해 주세요.";
  const d=dup(name);if(d)return d;
  saveGroups({...groups,[g]:[...list,name]});setIm(null);flash("‘"+name+"’ 운동을 추가했습니다");return null;
 };
 const rename=(old,name)=>{
  if(!name)return "운동 이름을 입력해 주세요.";
  if(name===old){setIm(null);return null}
  const d=dup(name,old);if(d)return d;
  saveGroups({...groups,[g]:list.map(n=>n===old?name:n)});setIm(null);flash("이름을 바꿨습니다");return null;
 };
 const remove=n=>{
  const u=usedDays(n);
  confirm({msg:"‘"+n+"’을(를) 운동 종목 목록에서 삭제할까요? 앞으로 운동 기록을 입력할 때 선택 목록에 나타나지 않습니다. "+(u>0?"이미 저장된 과거 기록 "+u+"일치에는 ‘"+n+"’ 이름이 그대로 남아 있고 삭제되지 않습니다.":"이 운동으로 저장된 기록은 없습니다."),okText:"삭제",onOk:()=>{
   saveGroups({...groups,[g]:groups[g].filter(x=>x!==n)});confirm(null);flash("목록에서 삭제했습니다");
  }});
 };
 return html`<div>
  <button class="btn ghost back" onClick=${back}>← 설정으로 돌아가기</button>
  <h2 class="sh" style=${{marginBottom:"6px"}}>운동 종목 수정</h2>
  <div class="hint" style=${{margin:"0 0 12px"}}>운동 부위를 고른 뒤, 그 부위의 운동 종목을 관리하세요. 이미 저장된 과거 기록은 바뀌지 않습니다.</div>
  <div class="chips">${names.map(n=>html`<button key=${n} class=${"chip"+(n===g?" on":"")} onClick=${()=>setG(n)}>${n}</button>`)}</div>
  <div class="card">
   <div style=${{fontWeight:700,marginBottom:"4px"}}>[${g}]</div>
   ${list.length===0&&html`<div class="empty">등록된 운동이 없습니다.</div>`}
   ${list.map(n=>html`<div class="xi" key=${n}><span>${n}</span>
    <button onClick=${()=>setIm({mode:"edit",old:n})}>수정</button>
    <button class="btn danger" onClick=${()=>remove(n)}>삭제</button></div>`)}
   <div class="acts"><button class="btn" onClick=${()=>setIm({mode:"add"})}>＋ 운동 종목 추가</button></div>
  </div>
  ${im&&im.mode==="add"&&html`<${InputModal} title=${"‘"+g+"’에 운동 추가"} note="추가한 운동은 운동 기록 입력 화면의 선택 목록에 바로 나타납니다." okText="추가" onOk=${add} onCancel=${()=>setIm(null)}/>`}
  ${im&&im.mode==="edit"&&html`<${InputModal} title="운동 이름 수정" init=${im.old} okText="이름 바꾸기" note=${v=>"‘"+im.old+"’ → ‘"+(v||"…")+"’ 로 바꿉니다. 앞으로 선택 목록에 새 이름이 나타납니다."+(usedDays(im.old)>0?" 이미 저장된 과거 기록 "+usedDays(im.old)+"일치에는 예전 이름 ‘"+im.old+"’이 그대로 남습니다.":"")} onOk=${v=>rename(im.old,v)} onCancel=${()=>setIm(null)}/>`}
 </div>`;
}


function ExForm({init,date,groups,addCustom,onSave,onDelete,onClose}){
 const [d,setD]=useState(date);
 const [name,setName]=useState(init?init.name:"");
 const [adding,setAdding]=useState(false);
 const [draft,setDraft]=useState("");
 const [sets,setSets]=useState(()=>{if(init&&repsArr(init).length){const w=weightsArr(init);return repsArr(init).map((r,i)=>({r,w:w[i],tr:true,tw:true}))}return [0,1,2].map(()=>({r:"",w:"",tr:false,tw:false}))});
 const [memo,setMemo]=useState(init&&init.memo?String(init.memo):"");
 const [err,setErr]=useState("");
 const inGroups=Object.values(groups).some(g=>g.includes(name));
 const onSel=e=>{const v=e.target.value;if(v==="__new__"){setAdding(true);setDraft("")}else{setName(v);setAdding(false)}};
 const confirmAdd=()=>{const n=norm(draft);if(!n)return;setName(addCustom(n));setAdding(false);setDraft("")};
 const setAt=(i,f,v)=>setSets(s=>s.map((x,j)=>{if(j===i)return {...x,[f]:f==="r"?intOnly(v):decOnly(v),["t"+f]:true};if(j>i&&!x["t"+f])return {...x,[f]:f==="r"?intOnly(v):decOnly(v)};return x}));
 const addSet=()=>setSets(s=>{const l=s[s.length-1]||{r:"",w:""};return [...s,{r:l.r,w:l.w,tr:false,tw:false}]});
 const submit=e=>{
  e.preventDefault();
  if(!d){setErr("날짜를 선택해 주세요.");return}
  if(!name){setErr("운동 종목을 선택해 주세요.");return}
  const kept=sets.filter(x=>x.r!==""&&+x.r>0);
  if(!kept.length){setErr("세트별 반복 횟수를 한 개 이상 입력해 주세요.");return}
  const arr=kept.map(x=>x.r),ws=kept.map(x=>x.w);
  const sum=arr.reduce((a,v)=>a+num(v),0);
  onSave(d,{id:init?init.id:Date.now()+"-"+(uid++),name,reps:String(Math.round(sum/arr.length)),sets:String(arr.length),weight:ws[0]||"",memo:memo.trim(),setReps:arr,setWeights:ws},init?date:null);
 };
 return html`<div class="ov" onClick=${onClose}><div class="sheet" role="dialog" onClick=${e=>e.stopPropagation()}>
  <h3>${init?"운동 수정":"운동 추가"}</h3>
  <form onSubmit=${submit}>
   <label>날짜<input type="date" value=${d} onChange=${e=>setD(e.target.value)} required/></label>
   <label>운동 종목
    <select value=${adding?"__new__":name} onChange=${onSel}>
     <option value="">운동을 선택하세요</option>
     ${Object.entries(groups).filter(([g,l])=>l.length>0).map(([g,list])=>html`<optgroup key=${g} label=${g}>${list.map(n=>html`<option key=${n} value=${n}>${n}</option>`)}</optgroup>`)}
     ${name&&!inGroups&&html`<option value=${name}>${name}</option>`}
     <option value="__new__">＋ 목록에 없는 운동 추가</option>
    </select>
   </label>
   ${adding&&html`<div class="srow" style=${{marginBottom:"10px"}}>
    <input type="text" placeholder="운동 이름 입력" maxLength="30" value=${draft} onInput=${e=>setDraft(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter"){e.preventDefault();confirmAdd()}}} style=${{marginTop:0}}/>
    <button type="button" class="btn sm" onClick=${confirmAdd}>추가</button>
    <button type="button" class="btn sm ghost" onClick=${()=>{setAdding(false);setDraft("")}}>취소</button>
   </div>`}
   <label style=${{marginBottom:"4px"}}>세트별 반복 횟수 · 중량</label>
   ${sets.map((x,i)=>html`<div class="srow" key=${i}>
    <span class="sn">${i+1}세트</span>
    <input type="text" inputMode="numeric" placeholder="12" value=${x.r} onChange=${e=>setAt(i,"r",e.target.value)} onInput=${e=>setAt(i,"r",e.target.value)} aria-label=${(i+1)+"세트 반복 횟수"} style=${{marginTop:0}}/>
    <span>회</span>
    <input type="text" inputMode="decimal" placeholder="kg" value=${x.w} onChange=${e=>setAt(i,"w",e.target.value)} onInput=${e=>setAt(i,"w",e.target.value)} aria-label=${(i+1)+"세트 중량(kg)"} style=${{marginTop:0}}/>
    <span>kg</span>
    <button type="button" class="ic" onClick=${()=>setSets(s=>s.filter((_,j)=>j!==i))} aria-label=${(i+1)+"세트 삭제"}>✕</button>
   </div>`)}
   <div class="hint" style=${{margin:"0 0 10px"}}>중량은 선택이에요. 1세트에 입력하면 아래 세트에 자동으로 채워지고, 직접 고친 칸은 유지돼요.</div>
   <button type="button" class="btn sm ghost" style=${{marginBottom:"12px"}} onClick=${addSet}>+ 세트 추가</button>
   <label>메모 (선택)<input type="text" maxLength="200" placeholder="메모" value=${memo} onChange=${e=>setMemo(e.target.value)} onInput=${e=>setMemo(e.target.value)}/></label>
   ${err&&html`<div class="imperr" role="alert">${err}</div>`}
   <div class="frow"><button type="button" class="btn ghost" onClick=${onClose}>취소</button><button class="btn">저장</button></div>
   ${init&&html`<button type="button" class="btn danger full" onClick=${onDelete}>삭제</button>`}
  </form>
 </div></div>`;
}

 useEffect(()=>{
  let done=false;const fin=()=>{if(!done){done=true;setReady(true)}};
  const to=setTimeout(fin,2500);
  (async()=>{
   try{
    idb=await IDB.open();
    const snap=idb?await IDB.get(idb,"snapshot"):null;
    if(loadInfo.rec&&snap&&snap.records&&typeof snap.records==="object"&&Object.keys(snap.records).length){
     setRecords(snap.records);saveKey(RK,snap.records);flash("보조 저장소에서 기록을 복구했습니다");
    }
    if(loadInfo.grp){
     if(snap&&snap.groups&&typeof snap.groups==="object"&&!Array.isArray(snap.groups)){const g=buildGroups(snap.groups);setGroups(g);saveKey(GK,g)}
     else saveKey(GK,groups);
    }else mirror();
    const o=await probe();
    if(!o.ls&&!o.idb)setBad("이 화면에서는 기록이 기기에 저장되지 않습니다. 앱을 닫으면 사라질 수 있으니 설정 > 데이터 백업 및 복원에서 저장 상태를 확인해 주세요.");
    else if(loadInfo.corrupt)setBad("저장된 기록 일부를 읽지 못해 원본을 따로 보관했습니다. 설정 > 데이터 백업 및 복원에서 현재 상태를 저장해 두세요.");
   }catch(e){}
   fin();
  })();
  return()=>clearTimeout(to);
 },[]);
 useEffect(()=>{if(tab==="set"&&sv==="bk")probe().then(setSt)},[tab,sv]);
 const goTab=k=>{setTab(k);setSv(null);if(mainRef.current)mainRef.current.scrollTop=0};

 const flash=(msg,err)=>{setToast({msg,err});clearTimeout(tm.current);tm.current=setTimeout(()=>setToast(null),2200)};
 const commit=next=>{setRecords(next);return saveKey(RK,next)};
 const addCustom=name=>{
  const f=findName(groups,name);
  if(f)return groups[f].find(n=>n.toLowerCase()===name.toLowerCase());
  saveGroups({...groups,[CG]:[...(groups[CG]||[]),name]});return name;
 };
 const saveEx=(date,rec,oldDate)=>{
  const next={...records};
  if(oldDate&&oldDate!==date){const l=(next[oldDate]||[]).filter(r=>r.id!==rec.id);if(l.length)next[oldDate]=l;else delete next[oldDate]}
  const l=[...(next[date]||[])];const i=l.findIndex(r=>r.id===rec.id);
  if(i>=0)l[i]=rec;else l.push(rec);
  next[date]=l;
  const ok=commit(next);
  const [y,m]=date.split("-").map(Number);
  setPicked(date);setCur({y,m:m-1});setForm(null);
  flash(ok?(oldDate?"수정되었습니다":"저장되었습니다"):"저장되었지만 이 브라우저에서는 새로고침 시 유지되지 않을 수 있습니다",!ok);
 };
 const delEx=()=>{
  const {rec,date}=form;
  setModal({msg:"‘"+rec.name+"’ 기록을 삭제할까요? 삭제하면 되돌릴 수 없습니다.",okText:"삭제",onOk:()=>{
   const next={...records};const l=(next[date]||[]).filter(r=>r.id!==rec.id);
   if(l.length)next[date]=l;else delete next[date];
   commit(next);setModal(null);setForm(null);flash("삭제되었습니다");
  }});
 };

 const backup=async()=>{
  const keys=Object.keys(records).filter(k=>records[k]&&records[k].length).sort();
  if(!keys.length){flash("백업할 운동기록이 없습니다",true);return}
  const out={};keys.forEach(k=>{out[k]=records[k]});
  const text=JSON.stringify({app:"나의 운동기록",version:1,exportedAt:new Date().toISOString(),customExercises:customs,exerciseGroups:groups,records:out},null,2);
  const filename="나의운동기록_백업_"+todayKey()+".json";
  setFb("");
  const r=await saveFile(filename,text);
  if(r==="declined")return;
  if(r==="fail"){setFb(text);return}
  try{localStorage.setItem("workout-last-backup",String(Date.now()))}catch(e){}
  if(r==="link")setFb(text);
  flash(r==="link"?"백업을 시도했습니다. 파일이 저장되지 않았다면 아래 내용을 복사해 두세요":"백업 파일이 저장되었습니다 ("+keys.length+"일치)");
 };
 const handleText=text=>{
  setImpErr("");
  const res=parseBackup(text);
  if(res.error){setImpErr("복원 실패: "+res.error+" 기존 데이터는 그대로 유지됩니다.");return}
  let t="알 수 없음";try{if(res.exportedAt){const dt=new Date(res.exportedAt);if(!isNaN(dt))t=dt.toLocaleString("ko-KR")}}catch(e){}
  if(!window.confirm("백업 시각: "+t+"\n운동 기록 "+res.days+"일 · 운동 종목 "+res.ex+"개\n\n현재 데이터가 이 백업으로 교체됩니다. 계속할까요?"))return;
  runRestore(res);
 };
 const onFile=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  setImpErr("");
  const rd=new FileReader();
  rd.onerror=()=>setImpErr("파일을 읽지 못했습니다. 기존 기록은 변경되지 않았습니다.");
  rd.onload=()=>handleText(String(rd.result));
  rd.readAsText(f);
 };
 const runRestore=data=>{
  const src=data.records;
  lsSet("workout-records-before-restore",records);
  const next={};
  Object.keys(src).forEach(k=>{
   next[k]=src[k];
  });
  const ng={};Object.keys(groups).forEach(k=>{ng[k]=[...groups[k]]});
  const low=new Set(Object.values(ng).flat().map(n=>n.toLowerCase()));
  const addTo=(gk,n)=>{if(!n||low.has(n.toLowerCase()))return;low.add(n.toLowerCase());(ng[gk]=ng[gk]||[]).push(n)};
  if(data.eg)Object.keys(data.eg).forEach(gk=>data.eg[gk].forEach(n=>addTo(gk in ng?gk:CG,n)));
  else data.customs.forEach(n=>addTo(CG,n));
  setRecords(next);setGroups(ng);
  const ok=saveKey(RK,next)&&saveKey(GK,ng);
  setImpErr("");
  flash(ok?"복원이 완료되었습니다 ("+Object.keys(src).length+"일치)":"복원했지만 새로고침 시 유지되지 않을 수 있습니다",!ok);
 };
 const wipe=()=>setModal({msg:"모든 운동 기록이 삭제됩니다. 계속할까요? (운동 종목 목록은 유지됩니다)",okText:"계속",onOk:()=>setModal({msg:"정말 삭제할까요? 되돌릴 수 없습니다. (먼저 백업을 권장합니다)",okText:"삭제",onOk:()=>{
  lsSet("workout-records-before-wipe",records);commit({});setModal(null);flash("모든 운동 기록을 삭제했어요");
 }})});

 const sec=(title,more,body)=>html`<section class="card"><div class="hd"><h2>${title}</h2><div>${more}</div></div>${body}</section>`;
 const exItems=k=>{
  const l=records[k]||[];
  if(!l.length)return html`<p class="empty">등록된 운동이 없어요</p>`;
  return l.map((r,idx)=>{
   const a=repsArr(r),wa=weightsArr(r);
   return html`<div class="li" key=${r.id||idx}><div class="g" onClick=${()=>setForm({rec:r,date:k})}>
    <p><b>${r.name}</b><span class="pri">${a.length?a.length+"세트":"세트 정보 없음"}</span></p>
    ${a.map((v,i)=>html`<small class="sl" key=${i}>${i+1}세트: ${v?v+"회":"미입력"}${wa[i]?" × "+wa[i]+"kg":""}</small>`)}
    ${filled(r.memo)&&html`<small class="sl">메모: ${r.memo}</small>`}
   </div></div>`;
  });
 };
 const topH=extra=>html`<div class="top"><h1>Workout</h1>${extra}</div>`;
 const daysSince=(()=>{try{const x=+localStorage.getItem("workout-last-backup");return x?Math.floor((Date.now()-x)/864e5):null}catch(e){return null}})();
 const vHome=()=>{
  const k=todayKey(),d=new Date(),h=d.getHours();
  const msg=h<12?"좋은 아침이에요. 가볍게 몸을 풀며 시작해요.":h<18?"오늘의 운동, 한 세트씩 차근차근 해봐요.":"오늘 하루도 수고했어요. 운동을 기록해 두세요.";
  return html`<div>
   ${topH(html`<div class="d">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${SUN[d.getDay()]}요일</div><small>${msg}</small>`)}
   ${bad&&html`<div class="imperr" role="alert" style=${{marginBottom:"14px"}}>${bad}</div>`}
   ${Object.keys(records).length>0&&(daysSince===null||daysSince>=14)&&html`<div class="hint" style=${{margin:"0 0 14px"}}>💾 ${daysSince===null?"아직 백업한 적이 없어요.":"백업한 지 "+daysSince+"일이 지났어요."} 설정 > 데이터 백업 및 복원에서 파일을 받아 두면 안전해요.</div>`}
   ${sec("오늘의 운동",html`<button class="btn sm ghost" onClick=${()=>goTab("cal")}>캘린더 ›</button><button class="btn sm" onClick=${()=>setForm({rec:null,date:k})}>+ 추가</button>`,exItems(k))}
  </div>`;
 };
 const vCal=()=>{
  const {y,m}=cur,f=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),t0=todayKey();
  const c=[...SUN.map(x=>html`<span key=${"w"+x}>${x}</span>`),...Array.from({length:f.getDay()},(_,i)=>html`<span key=${"e"+i}></span>`)];
  for(let i=1;i<=n;i++){const k=keyOf(y,m,i),has=(records[k]||[]).length>0;
   c.push(html`<button key=${k} class=${"day"+(k===t0?" today":"")+(k===picked?" sel":"")} onClick=${()=>setPicked(k)}>${i}<span class="dots">${has&&html`<i></i>`}</span></button>`)}
  const sd=new Date(...picked.split("-").map((v,i)=>i===1?v-1:+v));
  const mv=x=>{const dd=new Date(y,m+x,1);setCur({y:dd.getFullYear(),m:dd.getMonth()})};
  return html`<div>
   ${topH(null)}
   <section class="card"><div class="nav2"><button class="btn sm ghost" onClick=${()=>mv(-1)} aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button class="btn sm ghost" onClick=${()=>mv(1)} aria-label="다음 달">›</button><button class="btn sm" onClick=${()=>{const q=new Date();setCur({y:q.getFullYear(),m:q.getMonth()});setPicked(todayKey())}}>오늘</button></div><div class="grid">${c}</div><small><span style=${{color:"var(--g)"}}>●</span> 운동 기록</small></section>
   ${sec((sd.getMonth()+1)+"월 "+sd.getDate()+"일 ("+SUN[sd.getDay()]+") 운동기록",html`<button class="btn sm" onClick=${()=>setForm({rec:null,date:picked})}>+ 기록</button>`,exItems(picked))}
  </div>`;
 };
 const vStats=()=>html`<div>${topH(null)}<${StatsView} records=${records}/></div>`;
 const vSet=()=>{
  if(sv==="ex")return html`<div>${topH(null)}<${ExerciseScreen} groups=${groups} saveGroups=${saveGroups} records=${records} back=${()=>setSv(null)} flash=${flash} confirm=${setModal}/></div>`;
  if(sv==="bk"){
   let sa=0,lb=0;try{sa=+localStorage.getItem("workout-saved-at");lb=+localStorage.getItem("workout-last-backup")}catch(e){}
   const tt=v=>v?new Date(v).toLocaleString("ko-KR"):"없음";
   const days=Object.keys(records).filter(k=>records[k]&&records[k].length);
   const exN=days.reduce((a,k)=>a+records[k].length,0);
   const per=!st?"확인 중…":st.persisted===null?"이 브라우저에서 지원하지 않음":st.persisted?"허용됨":"미허용 (정기적으로 백업해 주세요)";
   const okSt=!st?"":(st.ls||st.idb)?"":" ⚠ 이 화면에서는 저장소를 사용할 수 없어 기록이 유지되지 않을 수 있어요.";
   return html`<div>
    ${topH(null)}
    <button class="btn ghost back" onClick=${()=>setSv(null)}>← 설정으로 돌아가기</button>
    ${sec("데이터 백업","",html`<div><p class="muted">최근 백업: ${tt(lb)}</p><button class="btn full" onClick=${backup}>백업 파일 저장 (JSON)</button>
     ${fb&&html`<div style=${{marginTop:"12px"}}><div class="hint" style=${{margin:0}}>파일이 저장되지 않았다면, 아래 ‘전체 복사’를 눌러 메모 앱 등에 붙여넣어 보관하세요.</div><button class="btn ghost full" onClick=${async()=>{const ok=await copyText(fb);flash(ok?"복사했습니다. 메모 앱에 붙여넣어 보관하세요":"복사하지 못했습니다. 아래 상자를 길게 눌러 전체 선택 후 복사하세요",!ok)}}>전체 복사</button><textarea readOnly value=${fb} onFocus=${e=>e.target.select()}></textarea></div>`}</div>`)}
    ${sec("데이터 복원","",html`<div><p class="muted">백업 파일을 불러오면 현재 데이터가 백업 내용으로 교체됩니다. 잘못된 파일은 거부되며 기존 데이터는 보호됩니다.</p>
     <button class="btn full ghost" onClick=${()=>fileRef.current&&fileRef.current.click()}>백업 파일 불러오기</button>
     <input ref=${fileRef} type="file" accept=".json,application/json" style=${{display:"none"}} onChange=${onFile}/>
     ${impErr&&html`<div class="imperr" role="alert">${impErr}</div>`}</div>`)}
    ${sec("저장 상태","",html`<p class="muted">데이터는 이 기기의 브라우저에만 저장됩니다.<br/>영구 저장 권한: ${per}${okSt}<br/>현재 저장된 운동기록 ${days.length}일 · 운동 ${exN}개<br/>마지막 저장: ${tt(sa)}</p>`)}
    ${sec("기타","",html`<div><p class="muted">앱 버전 ${VER}</p><button class="btn danger full" onClick=${wipe}>전체 데이터 삭제</button></div>`)}
   </div>`;
  }
  return html`<div>
   ${topH(null)}
   <button class="menu" onClick=${()=>setSv("ex")}><b>운동 종목 수정</b><small>운동 종목을 추가하고, 이름을 바꾸고, 목록에서 지울 수 있어요.</small><i>›</i></button>
   <button class="menu" onClick=${()=>setSv("bk")}><b>데이터 백업 및 복원</b><small>데이터를 파일로 저장해 두거나, 저장해 둔 파일에서 되살릴 수 있어요.</small><i>›</i></button>
  </div>`;
 };
 const TABS=[["home","🏠","홈"],["cal","📅","캘린더"],["stats","📊","통계"],["set","⚙️","설정"]];
 return html`<div>
  <main id="main" ref=${mainRef}>
   ${!ready?html`<div class="empty">기록을 불러오는 중…</div>`:tab==="home"?vHome():tab==="cal"?vCal():tab==="stats"?vStats():vSet()}
  </main>
  <nav role="tablist">${TABS.map(([k,e,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} class=${tab===k?"on":""} onClick=${()=>goTab(k)}>${e}<span>${l}</span></button>`)}</nav>
  ${toast&&html`<div class=${"toast"+(toast.err?" err":"")} role="status">${toast.msg}</div>`}
  ${form&&html`<${ExForm} key=${(form.rec?form.rec.id:"new")+form.date} init=${form.rec} date=${form.date} groups=${groups} addCustom=${addCustom} onSave=${saveEx} onDelete=${delEx} onClose=${()=>setForm(null)}/>`}
  ${modal&&html`<${Modal} msg=${modal.msg} okText=${modal.okText} onOk=${modal.onOk} onCancel=${()=>setModal(null)}/>`}
 </div>`;
}
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
