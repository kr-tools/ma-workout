<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<style>
/* ===== MY DAILY 공통 디자인 규칙 (Workout · Money · Calendar 동일) =====
   글꼴 Pretendard 16px / 카드 둥글기 16 · 버튼·입력창 둥글기 12 · 버튼·입력창 높이 48 · 그림자 없음
   카드 = 흰 배경 + 1px 선 / 하단 탭(이모지+이름) / 알림 = 위쪽 알약 / 팝업 = 아래에서 올라오는 시트(둥글기 20)
   색은 앱마다 다름: 아래 :root 변수만 바꾸면 됩니다. ===== */
:root{--bg:#f7f7f8;--sf:#fff;--tx:#333;--mu:#888;--bd:#e3e5e8;--ac:#7685a2;--acd:#576684;--ac2:#e9ecf2;--ac-tx:#fff;--dg:#c0392b;--dg2:#fbeae8;--today:#7685a2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--sf:#1b1d22;--tx:#ececec;--mu:#a0a0a0;--bd:#2f333c;--ac:#8c9fc4;--acd:#abbad9;--ac2:#242c3d;--ac-tx:#101316;--today:#8c9fc4;--dg:#ef7b6e;--dg2:#3a2220}}
:root[data-theme="dark"]{--bg:#121417;--sf:#1b1d22;--tx:#ececec;--mu:#a0a0a0;--bd:#2f333c;--ac:#8c9fc4;--acd:#abbad9;--ac2:#242c3d;--ac-tx:#101316;--today:#8c9fc4;--dg:#ef7b6e;--dg2:#3a2220}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 84px}
h1{font-size:22px;margin:0 0 14px;font-weight:700;letter-spacing:2px;color:var(--acd)}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 14px;min-height:48px}
button:hover{border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}
.dng{color:var(--dg);border-color:var(--dg)}
.dng:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bar .t{font-size:18px;font-weight:700;text-align:center;flex:1}
.cal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.g{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{padding:8px 0;text-align:center;font-size:13px;color:var(--mu);border-bottom:1px solid var(--bd)}
.dow.we,.cell.we .n{color:#3b6fb6}
.cell{min-height:92px;padding:6px;border:0;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);border-radius:0;background:var(--sf);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:3px;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--bg)}
.cell.out .n{color:var(--mu);opacity:.6}
.cell.has{background:var(--ac2)}
.n{font-size:14px;font-weight:600;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.cell.today .n{background:var(--today);color:var(--ac-tx)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.ex{font-size:12px;line-height:1.3;color:var(--acd);font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:none;font-size:11px;font-weight:700;color:var(--acd)}
.hint{color:var(--mu);font-size:13px;margin-top:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--ac2);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;color:var(--acd)}
.sum span{font-size:13px;color:var(--mu)}
.hd,.row{display:grid;grid-template-columns:2.2fr .9fr .9fr .9fr 1.6fr 44px;gap:8px;align-items:start}
.hd{font-size:13px;color:var(--mu);padding:0 0 6px}
.row{padding:10px 0;border-top:1px solid var(--bd)}
.lb{display:none;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select{width:100%;min-height:48px;padding:6px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1}
.x{padding:0;width:40px;color:var(--dg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .pri{flex:1;min-width:140px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:40;max-width:90%}
.toast.err{background:var(--dg);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:30}
.md{background:var(--sf);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%}
@media (min-width:600px){.ov{align-items:center;padding:16px}.md{border-radius:20px;padding:20px 16px}}
.md p{margin:0 0 16px}
.md .acts{margin:0;justify-content:flex-end}
.dirty{color:var(--dg);font-size:13px;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:16px 0}
@media (max-width:640px){
 .wrap{padding:10px 10px 84px}
 .cell{min-height:64px;padding:4px;align-items:center}
 .ex{display:none}
 .cnt{display:block}
 .hd{display:none}
 .row{grid-template-columns:1fr 1fr 1fr;gap:8px}
 .row>.c-ex,.row>.c-memo{grid-column:1/-1}
 .row>.c-del{grid-column:1/-1}
 .x{width:100%}
 .lb{display:block}
}
.wk{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.wk h3{font-size:14px;margin:0 0 2px;color:var(--mu);font-weight:600}
.wki{display:grid;grid-template-columns:170px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.bar2{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ac)}
.wki b{text-align:right;color:var(--acd)}
.cell.sel{outline:2px solid #3b6fb6;outline-offset:-3px}
.pnl h2{font-size:17px;margin:0 0 10px}
.lst{max-height:360px;overflow-y:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--bd)}
.lst li{padding:10px 4px;border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.lst .no{color:var(--acd);font-weight:700;min-width:22px}
.lst .nm{font-weight:600}
.lst .sep{color:var(--mu)}
.lst .na{color:var(--mu);font-style:italic}
.lst .mm{flex-basis:100%;margin-left:30px;color:var(--mu);font-size:14px}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bk button{flex:1;min-width:140px}
.imperr{color:var(--dg);background:var(--dg2);padding:8px 12px;border-radius:12px;margin-top:10px;font-size:14px}
.md.w{max-width:560px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;height:auto}
.opt small{display:block;color:var(--mu);font-weight:400;margin-top:2px}
textarea{width:100%;min-height:120px;margin-top:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:13px/1.4 monospace}
@media (max-width:640px){.wki{grid-template-columns:120px 1fr 36px;font-size:13px}}
html{-webkit-tap-highlight-color:transparent}
button,select{touch-action:manipulation}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{flex:1;border:0;border-radius:0;background:transparent;min-height:0;padding:8px 0 6px;font-size:20px;line-height:1.5;font-weight:400;color:var(--mu);display:flex;flex-direction:column;align-items:center}
.tab span{font-size:11px;margin-top:1px}
.tab.on{color:var(--acd);font-weight:700}
.sh{font-size:20px;margin:0}
.gt{font-size:16px;font-weight:700;margin:18px 0 8px}
.ysel{width:auto;min-height:44px;background:var(--sf);border:0;background:var(--ac2);border-radius:12px;padding:6px 14px;font-weight:600;color:var(--acd)}
.chcard{padding:14px 12px 10px}
.ch{display:flex;gap:6px;padding-top:18px}
.chy{position:relative;width:28px;height:180px;flex:none}
.chy span{position:absolute;right:0;transform:translateY(50%);font-size:12px;color:var(--mu);line-height:1}
.chp{position:relative;flex:1;height:180px;border-left:1px solid var(--mu);border-bottom:1px solid var(--mu)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--bd)}
.chb{position:absolute;inset:0;display:flex}
.chc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.cbar{width:62%;max-width:34px;background:var(--ac);border-radius:4px 4px 0 0}
.cv{font-size:12px;font-weight:700;color:var(--acd);margin-bottom:2px;line-height:1.2}
.cv.z{color:var(--mu);font-weight:500}
.chx{display:flex;margin-left:34px;margin-top:6px}
.chx>div{flex:1;text-align:center;font-size:12px;min-width:0}
.chx small{display:block;font-size:10px;color:var(--mu);overflow-wrap:anywhere;line-height:1.2}
.ft{display:flex;gap:8px;margin-top:12px}
.ft div{flex:1;background:var(--ac2);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--mu)}
.ft b{display:block;font-size:20px;color:var(--acd)}
.tb{display:grid;grid-template-columns:.8fr 1fr 1fr 1.2fr;font-size:14px;text-align:right}
.tb>div{padding:8px 4px;border-bottom:1px solid var(--bd)}
.tb>div:nth-child(4n+1){text-align:left}
.tb .h{color:var(--mu);font-size:13px}
.xl{max-height:280px;overflow-y:auto}
.xr{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--bd);font-size:14px}
.xr b{color:var(--acd);white-space:nowrap}
@media (max-width:640px){
 button,.pri{min-height:48px}
 input,select{min-height:48px}
 .x{min-height:48px}
 .row{gap:10px;padding:14px 0}
 .acts{gap:10px}
 .cell{min-height:60px}
 .ysel{min-height:44px}
}
.back{min-height:48px;margin-bottom:12px;font-weight:600}
.menu{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:16px 44px 16px 16px;margin-bottom:10px;border-radius:12px;min-height:76px;position:relative}
.menu b{font-size:17px}
.menu small{color:var(--mu);font-size:14px;margin-top:2px;font-weight:400}
.menu i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:26px;color:var(--mu)}
.big{width:100%;min-height:56px;font-size:17px;font-weight:700}
.desc{color:var(--mu);font-size:14px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:44px;border-radius:999px;padding:6px 16px}
.chip.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}
.xi{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.xi span{flex:1;min-width:0;overflow-wrap:anywhere}
.xi button{min-width:64px;min-height:44px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);

const GROUPS={
 "가슴":["벤치 프레스","인클라인 벤치 프레스","체스트 프레스","덤벨 플라이","케이블 크로스오버"],
 "등":["랫풀다운","시티드 로우","바벨 로우","덤벨 로우","풀업"],
 "어깨":["숄더 프레스","사이드 레터럴 레이즈","프론트 레이즈","리어 델트 플라이"],
 "하체":["스쿼트","레그 프레스","레그 익스텐션","레그 컬","런지","힙 쓰러스트","루마니안 데드리프트"],
 "팔":["바이셉 컬","해머 컬","트라이셉 푸시다운","오버헤드 트라이셉 익스텐션"],
 "복근 및 유산소":["크런치","레그 레이즈","플랭크","러닝머신","실내 자전거","일립티컬"]
};
const DOW=["월","화","수","목","금","토","일"];
const RK="workout-records-v1", CK="workout-custom-v1", GK="workout-groups-v1", CG="내가 추가한 운동";
let memStore={};
function lsGet(k,d){try{const v=localStorage.getItem(k);if(v===null)return memStore[k]!==undefined?memStore[k]:d;try{return JSON.parse(v)}catch(e){return d}}catch(e){return memStore[k]!==undefined?memStore[k]:d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){memStore[k]=v;return false}}

// 시작할 때 저장 상태를 점검한다. 읽기만 하며, 손상된 원본은 지우지 않고 별도 키에 복사해 둔다.
const loadInfo={rec:false,grp:false,corrupt:false};
function rawState(k,isObj){
 try{
  const v=localStorage.getItem(k);
  if(v===null)return "missing";
  const o=JSON.parse(v);
  if(!o||typeof o!=="object"||(isObj&&Array.isArray(o)))throw new SyntaxError("type");
  return "ok";
 }catch(e){
  if(e instanceof SyntaxError){try{if(localStorage.getItem(k+"-corrupt")===null)localStorage.setItem(k+"-corrupt",localStorage.getItem(k))}catch(_){}loadInfo.corrupt=true;return "corrupt"}
  return "missing";
 }
}
loadInfo.rec=rawState(RK,true)!=="ok";
loadInfo.grp=rawState(GK,true)!=="ok";
const IDB={
 open(){return new Promise(res=>{try{const r=indexedDB.open("workout-db",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv")};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
 get(db,k){return new Promise(res=>{try{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 set(db,k,v){return new Promise(res=>{try{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
};
let idb=null;
function mirror(){if(idb)IDB.set(idb,"snapshot",{records:lsGet(RK,{}),groups:lsGet(GK,null),savedAt:Date.now()})}
function saveKey(k,v){
 const ok=lsSet(k,v);
 let rb=false;try{rb=localStorage.getItem(k)===JSON.stringify(v)}catch(e){}
 try{localStorage.setItem("workout-saved-at",String(Date.now()))}catch(e){}
 mirror();
 return ok&&rb;
}
async function probe(){
 const o={ls:false,idb:false,persisted:null,standalone:false,framed:false};
 try{localStorage.setItem("__wl_test","1");o.ls=localStorage.getItem("__wl_test")==="1";localStorage.removeItem("__wl_test")}catch(e){}
 try{const db=idb||await IDB.open();if(db){await IDB.set(db,"__test",Date.now());o.idb=(await IDB.get(db,"__test"))!==undefined}}catch(e){}
 try{o.persisted=(navigator.storage&&navigator.storage.persisted)?await navigator.storage.persisted():null}catch(e){}
 o.standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
 try{o.framed=window.top!==window.self}catch(e){o.framed=true}
 return o;
}
async function saveFile(filename,text){
 try{const dl=(window.claude&&claude.use)?await claude.use("downloads"):null;if(dl){await dl.save({filename,data:text});return "ok"}}catch(e){if(e&&e.code==="declined")return "declined"}
 try{
  const f=new File([text],filename,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return "ok"}
 }catch(e){if(e&&e.name==="AbortError")return "declined"}
 try{
  const u=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return "link";
 }catch(e){}
 return "fail";
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){
  try{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();const ok=document.execCommand("copy");x.remove();return ok}catch(_){return false}
 }
}
function buildGroups(saved){
 const g={};
 Object.keys(GROUPS).forEach(k=>{g[k]=Array.isArray(saved[k])?saved[k].filter(n=>typeof n==="string"):[...GROUPS[k]]});
 Object.keys(saved).forEach(k=>{if(!(k in g)&&Array.isArray(saved[k]))g[k]=saved[k].filter(n=>typeof n==="string")});
 if(!g[CG])g[CG]=[];
 return g;
}
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const todayKey=()=>{const t=new Date();return keyOf(t.getFullYear(),t.getMonth(),t.getDate())};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
let uid=0;
const newRow=()=>({id:Date.now()+"-"+(uid++),name:"",reps:"",sets:"",weight:"",memo:"",adding:false,draft:""});
const intOnly=v=>v.replace(/\D/g,"").slice(0,4);
const decOnly=v=>{let s=v.replace(/[^\d.]/g,"");const i=s.indexOf(".");if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,"");return s.slice(0,7)};
const keyToLabel=k=>{const [y,m,d]=k.split("-").map(Number);return y+"년 "+m+"월 "+d+"일 ("+DOW[(new Date(y,m-1,d).getDay()+6)%7]+")"};
const shiftKey=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const t=new Date(y,m-1,d+n);return keyOf(t.getFullYear(),t.getMonth(),t.getDate())};

function Modal({msg,okText,onOk,onCancel}){
 return html`<div class="ov" onClick=${onCancel}><div class="md" role="dialog" onClick=${e=>e.stopPropagation()}>
  <p>${msg}</p>
  <div class="acts"><button onClick=${onCancel}>취소</button><button class="pri" onClick=${onOk}>${okText||"확인"}</button></div>
 </div></div>`;
}

function Calendar({cur,setCur,records,openDay,picked}){
 const {y,m}=cur;
 const first=new Date(y,m,1);
 const lead=(first.getDay()+6)%7;
 const dim=new Date(y,m+1,0).getDate();
 const total=Math.ceil((lead+dim)/7)*7;
 const tk=todayKey();
 const go=n=>{const d=new Date(y,m+n,1);setCur({y:d.getFullYear(),m:d.getMonth()})};
 const cells=[];
 for(let i=0;i<total;i++){
  const d=new Date(y,m,1-lead+i);
  const k=keyOf(d.getFullYear(),d.getMonth(),d.getDate());
  const rec=records[k];
  const has=rec&&rec.length>0;
  const cls="cell"+(d.getMonth()!==m?" out":"")+(has?" has":"")+(k===tk?" today":"")+(k===picked?" sel":"")+((i%7)>=5?" we":"");

 }
 return html`<div>

  </div>
 </div>`;
}

const ymd=k=>{const [y,m,d]=k.split("-").map(Number);return y+"년 "+m+"월 "+d+"일"};
const norm=s=>s.trim().replace(/\s+/g," ");
const findName=(gs,name)=>{const k=name.toLowerCase();for(const g of Object.keys(gs))if(gs[g].some(n=>n.toLowerCase()===k))return g;return null};
const filled=v=>v!==undefined&&v!==null&&String(v)!=="";

function Stats({cur,records}){
 const {y,m}=cur;
 const lead=(new Date(y,m,1).getDay()+6)%7;
 const dim=new Date(y,m+1,0).getDate();
 let days=0,ex=0,sets=0;const wk=[];
 for(let d=1;d<=dim;d++){
  const wi=Math.floor((lead+d-1)/7);
  if(!wk[wi])wk[wi]={s:d,e:d,c:0};
  wk[wi].e=d;
  const rec=records[keyOf(y,m,d)];
  if(rec&&rec.length){days++;ex+=rec.length;wk[wi].c++;sets+=rec.reduce((a,r)=>a+num(r.sets),0)}
 }
 return html`<div class="card">
  <div style=${{fontWeight:700,marginBottom:"8px"}}>${y}년 ${m+1}월 운동 통계</div>
  <div class="sum" style=${{gridTemplateColumns:"repeat(3,1fr)"}}>
   <div><b>${days}</b><span>총 운동 일수</span></div>
   <div><b>${ex}</b><span>총 운동 종목 수</span></div>
   <div><b>${sets}</b><span>총 세트 수</span></div>
  </div>
  <div class="wk">
   <h3>주별 운동 횟수 (운동한 날 기준)</h3>
   ${wk.map((w,i)=>html`<div class="wki" key=${i}>
    <span>${i+1}주차 (${m+1}/${w.s}~${m+1}/${w.e})</span>
    <div class="bar2"><i style=${{width:(w.c/(w.e-w.s+1)*100)+"%"}}></i></div>
    <b>${w.c}회</b>
   </div>`)}
  </div>
 </div>`;
}

function parseBackup(text){
 let o;try{o=JSON.parse(text)}catch(e){return{error:"JSON 형식이 아닌 파일입니다."}}
 const bad=m=>({error:m});
 if(!o||typeof o!=="object"||Array.isArray(o)||!o.records||typeof o.records!=="object"||Array.isArray(o.records))return bad("Workout 백업 파일이 아닙니다.");
 const str=x=>x==null?"":String(x);
 const recs={};let days=0,ex=0;
 for(const k of Object.keys(o.records)){
  const [y,m,d]=k.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||dt.getMonth()!==m-1||dt.getDate()!==d)return bad("날짜 형식이 올바르지 않습니다: "+k+".");
  const v=o.records[k];
  if(!Array.isArray(v))return bad(k+" 기록의 형식이 올바르지 않습니다.");
  if(!v.length)continue;
  const ids=new Set();const norm=[];
  for(const it of v){
   if(!it||typeof it!=="object")return bad(k+" 기록의 형식이 올바르지 않습니다.");
   const name=str(it.name).trim();
   if(!name)return bad(k+" 기록에 운동 종목 이름이 없는 항목이 있습니다.");
   const reps=str(it.reps),sets=str(it.sets),weight=str(it.weight);
   if(!/^\d{0,4}$/.test(reps)||!/^\d{0,4}$/.test(sets)||!/^\d*\.?\d*$/.test(weight))return bad(k+" 기록에 올바르지 않은 숫자 값이 있습니다.");
   let id=str(it.id);if(!id||ids.has(id))id=Date.now()+"-"+(uid++);ids.add(id);
   norm.push({id,name,reps,sets,weight,memo:str(it.memo)});
  }
  recs[k]=norm;days++;ex+=norm.length;
 }
 if(!days)return bad("복원할 운동기록이 없습니다.");
 const customs=Array.isArray(o.customExercises)?o.customExercises.filter(s=>typeof s==="string"&&s.trim()).map(s=>s.trim().slice(0,30)):[];
 let eg=null;
 if(o.exerciseGroups!==undefined){
  const x=o.exerciseGroups;
  if(!x||typeof x!=="object"||Array.isArray(x))return bad("운동 종목 설정의 형식이 올바르지 않습니다.");
  eg={};
  for(const gk of Object.keys(x)){
   if(!Array.isArray(x[gk])||x[gk].some(n=>typeof n!=="string"))return bad("운동 종목 설정의 형식이 올바르지 않습니다.");
   eg[gk]=x[gk].map(norm).filter(Boolean).slice(0,200);
  }
 }
 return{records:recs,customs,eg,days,ex};
}

function BarChart({items}){
 const maxV=Math.max(0,...items.map(i=>i.v));
 const step=maxV<=4?1:maxV<=10?2:5;
 const top=Math.max(Math.ceil(maxV/step)*step,step*3);
 const ticks=[];for(let t=0;t<=top;t+=step)ticks.push(t);
 return html`<div>
  <div class="ch">
   <div class="chy">${ticks.map(t=>html`<span key=${t} style=${{bottom:(t/top*100)+"%"}}>${t}</span>`)}</div>
   <div class="chp">
    ${ticks.map(t=>html`<i class="gl" key=${t} style=${{bottom:(t/top*100)+"%"}}></i>`)}
    <div class="chb">${items.map((it,i)=>html`<div class="chc" key=${i}>
     <span class=${"cv"+(it.v?"":" z")}>${it.v}</span>
     <div class="cbar" style=${{height:(it.v/top*100)+"%"}}></div>

   </div>
  </div>
  <div class="chx">${items.map((it,i)=>html`<div key=${i}><span>${it.l}</span>${it.s&&html`<small>${it.s}</small>`}</div>`)}</div>
 </div>`;
}

function StatsView({records}){
 const now=new Date();
 const years=[...new Set(Object.keys(records).filter(k=>records[k]&&records[k].length).map(k=>+k.slice(0,4)))].sort((a,b)=>a-b);
 const list=years.length?years:[now.getFullYear()];
 const [yr,setYr]=useState(list.includes(now.getFullYear())?now.getFullYear():list[list.length-1]);
 const [mo,setMo]=useState(now.getMonth());
 const Y=list.includes(yr)?yr:list[list.length-1];
 const yearHas=years.includes(Y);
 const M=Array.from({length:12},()=>({d:0,s:0,r:0}));const ex={};
 Object.keys(records).forEach(k=>{
  const rec=records[k];
  if(!rec||!rec.length||+k.slice(0,4)!==Y)return;
  const m=+k.slice(5,7)-1;M[m].d++;
  rec.forEach(r=>{M[m].s+=num(r.sets);M[m].r+=num(r.sets)*num(r.reps);ex[r.name]=(ex[r.name]||0)+1});
 });
 const tot=M.reduce((a,x)=>({d:a.d+x.d,s:a.s+x.s,r:a.r+x.r}),{d:0,s:0,r:0});
 const lead=(new Date(Y,mo,1).getDay()+6)%7;
 const dim=new Date(Y,mo+1,0).getDate();
 const nw=Math.ceil((lead+dim)/7);
 const weeks=[];
 for(let w=0;w<nw;w++){
  const s=Math.max(1,w*7-lead+1),e=Math.min(dim,(w+1)*7-lead);
  let c=0;for(let d=s;d<=e;d++){const rec=records[keyOf(Y,mo,d)];if(rec&&rec.length)c++}
  weeks.push({l:(w+1)+"주 차",s:(mo+1)+"/"+s+"~"+(mo+1)+"/"+e,v:c});
 }
 const wTot=weeks.reduce((a,w)=>a+w.v,0);
 const exList=Object.entries(ex).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
 return html`<div>

   <h2 class="sh">월별 운동 통계</h2>
   <select class="ysel" value=${Y} onChange=${e=>setYr(+e.target.value)} aria-label="연도 선택">${list.map(y=>html`<option key=${y} value=${y}>${y}년</option>`)}</select>
  </div>
  ${!yearHas?html`<div class="card empty">해당 연도에 기록된 운동기록이 없습니다.</div>`:html`<div>
   <div class="card"><div class="sum">
    <div><b>${tot.d}</b><span>운동 일수</span></div>
    <div><b>${tot.s}</b><span>총 세트 수</span></div>
    <div><b>${tot.r}</b><span>총 반복 횟수</span></div>
   </div></div>
   <div class="gt">월별 운동 일수</div>
   <div class="card chcard"><${BarChart} items=${M.map((x,i)=>({l:(i+1)+"월",v:x.d}))}/></div>
   <div class="bar" style=${{marginTop:"18px"}}>
    <div class="gt" style=${{margin:0}}>월별 주간 운동 횟수</div>
    <select class="ysel" value=${mo} onChange=${e=>setMo(+e.target.value)} aria-label="월 선택">${Array.from({length:12},(_,i)=>html`<option key=${i} value=${i}>${Y}년 ${i+1}월</option>`)}</select>
   </div>
   <div class="card chcard" style=${{marginTop:"8px"}}>
    <${BarChart} items=${weeks}/>
    <div class="ft">
     <div><b>${wTot}일</b>${mo+1}월 총 운동 일수</div>
     <div><b>${(wTot/weeks.length).toFixed(1)}일</b>주간 평균 운동 일수</div>
    </div>
   </div>
  </div>`}
 </div>`;
}

  <div class="chips">${names.map(n=>html`<button key=${n} class=${"chip"+(n===g?" on":"")} onClick=${()=>setG(n)}>${n}</button>`)}</div>
  <div class="card">
   <div style=${{fontWeight:700,marginBottom:"4px"}}>[${g}]</div>
   ${list.length===0&&html`<div class="empty">등록된 운동이 없습니다.</div>`}
   ${list.map(n=>html`<div class="xi" key=${n}><span>${n}</span>
    <button onClick=${()=>setIm({mode:"edit",old:n})}>수정</button>
    <button class="dng" onClick=${()=>remove(n)}>삭제</button></div>`)}
   <div class="acts"><button class="pri" onClick=${()=>setIm({mode:"add"})}>＋ 운동 종목 추가</button></div>
  </div>
  ${im&&im.mode==="add"&&html`<${InputModal} title=${"‘"+g+"’에 운동 추가"} note="추가한 운동은 운동 기록 입력 화면의 선택 목록에 바로 나타납니다." okText="추가" onOk=${add} onCancel=${()=>setIm(null)}/>`}
  ${im&&im.mode==="edit"&&html`<${InputModal} title="운동 이름 수정" init=${im.old} okText="이름 바꾸기" note=${v=>"‘"+im.old+"’ → ‘"+(v||"…")+"’ 로 바꿉니다. 앞으로 선택 목록에 새 이름이 나타납니다."+(usedDays(im.old)>0?" 이미 저장된 과거 기록 "+usedDays(im.old)+"일치에는 예전 이름 ‘"+im.old+"’이 그대로 남습니다.":"")} onOk=${v=>rename(im.old,v)} onCancel=${()=>setIm(null)}/>`}
 </div>`;
}

function Row({r,idx,groups,upd,del,addCustom}){
 const inGroups=Object.values(groups).some(g=>g.includes(r.name));
 const onSel=e=>{
  const v=e.target.value;
  if(v==="__new__")upd(r.id,{adding:true,draft:""});
  else upd(r.id,{name:v,adding:false});
 };
 const confirmAdd=()=>{const n=r.draft.trim();if(!n)return;addCustom(r.id,n)};
 return html`<div class="row">
  <div class="c-ex">
   <label class="lb">운동 종목</label>
   <select value=${r.adding?"__new__":r.name} onChange=${onSel} aria-label=${"운동 종목 "+(idx+1)}>
    <option value="">운동을 선택하세요</option>
    ${Object.entries(groups).filter(([g,l])=>l.length>0).map(([g,list])=>html`<optgroup key=${g} label=${g}>${list.map(n=>html`<option key=${n} value=${n}>${n}</option>`)}</optgroup>`)}
    ${r.name&&!inGroups&&html`<option value=${r.name}>${r.name}</option>`}
    <option value="__new__">＋ 목록에 없는 운동 추가</option>
   </select>
   ${r.adding&&html`<div class="add">
    <input autoFocus placeholder="운동 이름 입력" value=${r.draft} maxLength="30"
      onChange=${()=>{}} onInput=${e=>upd(r.id,{draft:e.target.value})}
      onKeyDown=${e=>{if(e.key==="Enter")confirmAdd()}} />
    <button class="pri" onClick=${confirmAdd}>추가</button>
    <button onClick=${()=>upd(r.id,{adding:false,draft:""})}>취소</button>
   </div>`}
  </div>
  <div><label class="lb">세트별 횟수</label><input inputMode="numeric" placeholder="12" value=${r.reps} onChange=${e=>upd(r.id,{reps:intOnly(e.target.value)})} aria-label="세트별 횟수"/></div>
  <div><label class="lb">세트 수</label><input inputMode="numeric" placeholder="4" value=${r.sets} onChange=${e=>upd(r.id,{sets:intOnly(e.target.value)})} aria-label="세트 수"/></div>
  <div><label class="lb">중량(kg)</label><input inputMode="decimal" placeholder="40" value=${r.weight} onChange=${e=>upd(r.id,{weight:decOnly(e.target.value)})} aria-label="중량(kg)"/></div>
  <div class="c-memo"><label class="lb">메모</label><input placeholder="메모 (선택)" value=${r.memo} maxLength="200" onChange=${e=>upd(r.id,{memo:e.target.value})} aria-label="메모"/></div>
  <div class="c-del"><button class="x" onClick=${()=>del(r.id)} aria-label=${"운동 행 "+(idx+1)+" 삭제"} title="이 운동 삭제">✕<span class="lb" style=${{display:"none"}}></span></button></div>
 </div>`;
}

function App(){
 const t=new Date();
 const [records,setRecords]=useState(()=>{const r=lsGet(RK,{});return r&&typeof r==="object"&&!Array.isArray(r)?r:{}});
 const [groups,setGroups]=useState(()=>{
  const saved=lsGet(GK,null);
  if(saved&&typeof saved==="object"&&!Array.isArray(saved))return buildGroups(saved);
  const old=lsGet(CK,[]);const all=new Set(Object.values(GROUPS).flat());
  return buildGroups({[CG]:(Array.isArray(old)?old:[]).filter(n=>typeof n==="string"&&n&&!all.has(n))});
 });
 const customs=groups[CG]||[];
 const [sv,setSv]=useState(null);
 const [ready,setReady]=useState(false);
 const [autoAt,setAutoAt]=useState(null);
 const [bad,setBad]=useState(null);
 const saveGroups=g=>{setGroups(g);if(!saveKey(GK,g))flash("저장했지만 새로고침하면 유지되지 않을 수 있습니다",true)};
 const [cur,setCur]=useState({y:t.getFullYear(),m:t.getMonth()});
 const [sel,setSel]=useState(null);
 const [rows,setRows]=useState([]);
 const [dirty,setDirty]=useState(false);
 const [toast,setToast]=useState(null);
 const [modal,setModal]=useState(null);
 const tm=useRef();
 const [picked,setPicked]=useState(todayKey());
 const [tab,setTab]=useState("log");
 const [pend,setPend]=useState(null);
 const [impErr,setImpErr]=useState("");
 const [fb,setFb]=useState("");
 const [paste,setPaste]=useState(null);
 const fileRef=useRef();
 const latest=useRef({});
 latest.current={rows,sel,records,dirty};
 const doAuto=()=>{
  const {rows,sel,records,dirty}=latest.current;
  if(!sel||!dirty)return;
  const v=rows.filter(r=>r.name);
  if(!v.length)return;
  const clean=v.map(({id,name,reps,sets,weight,memo})=>({id,name,reps,sets,weight,memo}));
  const next={...records,[sel]:clean};
  latest.current.records=next;latest.current.dirty=false;
  const ok=saveKey(RK,next);
  setRecords(next);setDirty(false);setAutoAt(new Date());
  if(!ok)flash("저장에 실패했습니다. 설정 > 저장 상태 확인을 눌러 보세요",true);
 };
 useEffect(()=>{
  let done=false;const fin=()=>{if(!done){done=true;setReady(true)}};
  const to=setTimeout(fin,2500);
  (async()=>{
   try{
    idb=await IDB.open();
    const snap=idb?await IDB.get(idb,"snapshot"):null;
    if(loadInfo.rec&&snap&&snap.records&&typeof snap.records==="object"&&Object.keys(snap.records).length){
     setRecords(snap.records);saveKey(RK,snap.records);flash("보조 저장소에서 기록을 복구했습니다");
    }
    if(loadInfo.grp){
     if(snap&&snap.groups&&typeof snap.groups==="object"&&!Array.isArray(snap.groups)){const g=buildGroups(snap.groups);setGroups(g);saveKey(GK,g)}
     else saveKey(GK,groups);
    }else mirror();
    const o=await probe();
    if(!o.ls&&!o.idb)setBad("이 화면에서는 기록이 기기에 저장되지 않습니다. 앱을 닫으면 사라질 수 있으니 설정 > 저장 상태 확인을 눌러 주세요.");
    else if(loadInfo.corrupt)setBad("저장된 기록 일부를 읽지 못해 원본을 따로 보관했습니다. 설정 > 기록 백업으로 현재 상태를 저장해 두세요.");
   }catch(e){}
   fin();
  })();
  return()=>clearTimeout(to);
 },[]);
 useEffect(()=>{
  if(!dirty||!sel)return;
  const t=setTimeout(doAuto,500);return()=>clearTimeout(t);
 },[rows,dirty,sel]);
 useEffect(()=>{
  const h=()=>{if(document.visibilityState==="hidden")doAuto()};
  document.addEventListener("visibilitychange",h);window.addEventListener("pagehide",doAuto);
  return()=>{document.removeEventListener("visibilitychange",h);window.removeEventListener("pagehide",doAuto)};
 },[]);

 const backup=async()=>{
  const keys=Object.keys(records).filter(k=>records[k]&&records[k].length).sort();
  if(!keys.length){flash("백업할 운동기록이 없습니다",true);return}
  const out={};keys.forEach(k=>{out[k]=records[k]});
  const text=JSON.stringify({app:"나의 운동기록",version:1,exportedAt:new Date().toISOString(),customExercises:customs,exerciseGroups:groups,records:out},null,2);
  const filename="나의운동기록_백업_"+todayKey()+".json";
  setFb("");
  const r=await saveFile(filename,text);
  if(r==="declined")return;
  if(r==="fail"){setFb(text);return}
  try{localStorage.setItem("workout-last-backup",String(Date.now()))}catch(e){}
  if(r==="link")setFb(text);
  flash(r==="link"?"백업을 시도했습니다. 파일이 저장되지 않았다면 아래 내용을 복사해 두세요":"백업 파일이 저장되었습니다 ("+keys.length+"일치)");
 };
 const handleText=text=>{
  setImpErr("");
  const res=parseBackup(text);
  if(res.error){setImpErr(res.error+" 기존 기록은 변경되지 않았습니다.");return}
  const conflicts=Object.keys(res.records).filter(k=>records[k]&&records[k].length).length;
  setPend({stage:"choose",mode:"merge",data:{...res,conflicts}});
 };
 const onFile=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  setImpErr("");
  const rd=new FileReader();
  rd.onerror=()=>setImpErr("파일을 읽지 못했습니다. 기존 기록은 변경되지 않았습니다.");
  rd.onload=()=>handleText(String(rd.result));
  rd.readAsText(f);
 };
 const runRestore=()=>{
  const src=pend.data.records;
  lsSet("workout-records-before-restore",records);
  const next={...records};
  Object.keys(src).forEach(k=>{
   if(pend.mode==="overwrite"){next[k]=src[k];return}
   const ex=records[k]||[];
   const sig=r=>[r.name,r.reps,r.sets,r.weight,r.memo].join("\u0001");
   const seen=new Set(ex.map(sig));const ids=new Set(ex.map(r=>r.id));
   const add=[];
   src[k].forEach(r=>{const s=sig(r);if(seen.has(s))return;seen.add(s);add.push(ids.has(r.id)?{...r,id:Date.now()+"-"+(uid++)}:r)});
   next[k]=[...ex,...add];
  });
  const ng={};Object.keys(groups).forEach(k=>{ng[k]=[...groups[k]]});
  const low=new Set(Object.values(ng).flat().map(n=>n.toLowerCase()));
  const addTo=(gk,n)=>{if(!n||low.has(n.toLowerCase()))return;low.add(n.toLowerCase());(ng[gk]=ng[gk]||[]).push(n)};
  if(pend.data.eg)Object.keys(pend.data.eg).forEach(gk=>pend.data.eg[gk].forEach(n=>addTo(gk in ng?gk:CG,n)));
  else pend.data.customs.forEach(n=>addTo(CG,n));
  setRecords(next);setGroups(ng);
  const ok=saveKey(RK,next)&&saveKey(GK,ng);
  setPend(null);setImpErr("");
  flash(ok?"복원이 완료되었습니다 ("+Object.keys(src).length+"일치)":"복원했지만 새로고침 시 유지되지 않을 수 있습니다",!ok);
 };

 const flash=(msg,err)=>{setToast({msg,err});clearTimeout(tm.current);tm.current=setTimeout(()=>setToast(null),2200)};
 const load=k=>{const rec=records[k];setRows(rec&&rec.length?rec.map(r=>({...r,adding:false,draft:""})):[newRow()]);setSel(k);setPicked(k);setDirty(false);
  const [y,m]=k.split("-").map(Number);setCur({y,m:m-1})};
 const guard=fn=>{
  if(dirty&&rows.some(r=>r.name)){doAuto();fn();return}
  if(dirty)setModal({msg:"저장하지 않은 변경 내용이 있습니다. 저장하지 않고 이동하면 입력한 내용이 사라집니다.",okText:"저장 안 함",onOk:()=>{setModal(null);setDirty(false);fn()}});
  else fn();
 };
 useEffect(()=>{
  const h=e=>{if(dirty){e.preventDefault();e.returnValue=""}};
  window.addEventListener("beforeunload",h);return()=>window.removeEventListener("beforeunload",h);
 },[dirty]);

 const upd=(id,p)=>{setRows(rs=>rs.map(r=>r.id===id?{...r,...p}:r));if(!("adding" in p)||"name" in p)setDirty(true);};
 const del=id=>{setRows(rs=>rs.filter(r=>r.id!==id));setDirty(true)};
 const addRow=()=>{setRows(rs=>[...rs,newRow()]);setDirty(true)};
 const addCustom=(id,name)=>{
  const f=findName(groups,name);let nm=name;
  if(f)nm=groups[f].find(n=>n.toLowerCase()===name.toLowerCase());
  else saveGroups({...groups,[CG]:[...(groups[CG]||[]),name]});
  upd(id,{name:nm,adding:false,draft:""});
 };

 const valid=rows.filter(r=>r.name);
 const sumEx=valid.length;
 const sumSets=valid.reduce((a,r)=>a+num(r.sets),0);
 const sumReps=valid.reduce((a,r)=>a+num(r.sets)*num(r.reps),0);

 const save=()=>{
  if(!valid.length){flash("저장할 운동을 선택해 주세요",true);return}
  const clean=valid.map(({id,name,reps,sets,weight,memo})=>({id,name,reps,sets,weight,memo}));
  const next={...records,[sel]:clean};
  setRecords(next);
  const ok=saveKey(RK,next);
  setRows(clean.map(r=>({...r,adding:false,draft:""})));
  setDirty(false);
  setAutoAt(new Date());
  flash(ok?"저장되었습니다":"저장되었지만 이 브라우저에서는 새로고침 시 유지되지 않을 수 있습니다",!ok);
 };
 const removeRecord=()=>{
  setModal({msg:keyToLabel(sel)+"의 운동기록을 모두 삭제할까요? 삭제하면 되돌릴 수 없습니다.",okText:"삭제",onOk:()=>{
   const next={...records};delete next[sel];setRecords(next);saveKey(RK,next);
   setRows([newRow()]);setDirty(false);setModal(null);flash("기록이 삭제되었습니다");
  }});
 };

 const hasSaved=sel&&records[sel]&&records[sel].length>0;

const daysSince=(()=>{try{const t=+localStorage.getItem("workout-last-backup");return t?Math.floor((Date.now()-t)/864e5):null}catch(e){return null}})();
 const renderSettings=()=>{
  if(sv==="ex")return html`<${ExerciseScreen} groups=${groups} saveGroups=${saveGroups} records=${records} back=${()=>setSv(null)} flash=${flash} confirm=${setModal}/>`;
  if(sv==="st")return html`<${StorageScreen} back=${()=>setSv(null)} flash=${flash} records=${records}/>`;
  if(sv==="bk")return html`<div>
   <button class="back" onClick=${()=>setSv(null)}>← 설정으로 돌아가기</button>
   <h2 class="sh" style=${{marginBottom:"12px"}}>기록 백업 및 복원</h2>
   <div class="card">
    <button class="big pri" onClick=${backup}>기록 백업</button>
    <p class="desc">현재 저장된 운동 기록과 운동 종목 설정을 파일로 내려받습니다. 휴대폰을 바꾸거나 브라우저 데이터를 지우기 전에 꼭 받아 두세요.</p>
   </div>
   <div class="card">
    <button class="big" onClick=${()=>fileRef.current&&fileRef.current.click()}>백업 불러오기</button>
    <p class="desc">이전에 저장한 백업 파일을 골라 기록을 복원합니다. 고른 뒤 병합·덮어쓰기를 선택하고 한 번 더 확인해야 실행되며, 그 전에는 아무것도 바뀌지 않습니다.</p>
    <input ref=${fileRef} type="file" accept=".json,application/json" style=${{display:"none"}} onChange=${onFile}/>
    <button class="big" style=${{marginTop:"10px"}} onClick=${()=>setPaste(paste===null?"":null)}>복사해 둔 내용으로 불러오기</button>
    ${paste!==null&&html`<div><textarea value=${paste} placeholder="복사해 둔 백업 내용을 여기에 붙여넣으세요" onChange=${e=>setPaste(e.target.value)}></textarea>
     <button class="big pri" style=${{marginTop:"8px"}} onClick=${()=>{if(!paste.trim()){setImpErr("붙여넣은 내용이 없습니다. 기존 기록은 변경되지 않았습니다.");return}handleText(paste)}}>불러오기</button></div>`}
    ${impErr&&html`<div class="imperr" role="alert">${impErr}</div>`}
   </div>
   ${fb&&html`<div class="card"><div class="hint" style=${{margin:0}}>파일이 저장되지 않았다면, 아래 ‘전체 복사’를 눌러 메모 앱 등에 붙여넣어 보관하세요. 나중에 ‘복사해 둔 내용으로 불러오기’로 복원할 수 있습니다.</div><button class="big" style=${{margin:"10px 0"}} onClick=${async()=>{const ok=await copyText(fb);flash(ok?"복사했습니다. 메모 앱에 붙여넣어 보관하세요":"복사하지 못했습니다. 아래 상자를 길게 눌러 전체 선택 후 복사하세요",!ok)}}>전체 복사</button><textarea readOnly value=${fb} onFocus=${e=>e.target.select()}></textarea></div>`}
  </div>`;
  return html`<div>
   <h2 class="sh" style=${{marginBottom:"12px"}}>설정</h2>
   <button class="menu" onClick=${()=>setSv("ex")}><b>운동 종목 수정</b><small>운동 종목을 추가하고, 이름을 바꾸고, 목록에서 지울 수 있어요.</small><i>›</i></button>
   <button class="menu" onClick=${()=>setSv("bk")}><b>기록 백업 및 복원</b><small>기록을 파일로 저장해 두거나, 저장해 둔 파일에서 되살릴 수 있어요.</small><i>›</i></button>
   <button class="menu" onClick=${()=>setSv("st")}><b>저장 상태 확인</b><small>이 기기에 기록이 제대로 저장되고 있는지 점검해요.</small><i>›</i></button>
  </div>`;
 };
 return html`<div class="wrap">
  <h1>Workout</h1>
  ${bad&&html`<div class="imperr" role="alert" style=${{marginBottom:"10px"}}>${bad}</div>`}
  ${tab==="log"&&Object.keys(records).length>0&&(daysSince===null||daysSince>=14)&&html`<div class="hint" style=${{margin:"0 0 10px"}}>💾 ${daysSince===null?"아직 백업한 적이 없어요.":"백업한 지 "+daysSince+"일이 지났어요."} 설정 > 기록 백업으로 파일을 받아 두면 안전해요.</div>`}
  <div class="tabs" role="tablist">
   <button role="tab" aria-selected=${tab==="log"} class=${"tab"+(tab==="log"?" on":"")} onClick=${()=>setTab("log")}>📝<span>기록</span></button>
   <button role="tab" aria-selected=${tab==="stats"} class=${"tab"+(tab==="stats"?" on":"")} onClick=${()=>guard(()=>{setSel(null);setTab("stats")})}>📊<span>통계</span></button>
   <button role="tab" aria-selected=${tab==="settings"} class=${"tab"+(tab==="settings"?" on":"")} onClick=${()=>guard(()=>{setSel(null);setTab("settings");setSv(null)})}>⚙️<span>설정</span></button>
  </div>
  ${!ready?html`<div class="empty">기록을 불러오는 중…</div>`:tab==="settings"?renderSettings():tab==="stats"?html`<${StatsView} records=${records}/>`:sel===null?html`<div>
   <${Calendar} cur=${cur} setCur=${setCur} records=${records} openDay=${setPicked} picked=${picked}/>
   <div style=${{height:"12px"}}></div>
   <${DayPanel} k=${picked} rec=${records[picked]} open=${load}/>
  </div>`:html`<div>
   <div class="bar">
    <button onClick=${()=>guard(()=>setSel(null))}>‹ 캘린더</button>
    <div class="t">${keyToLabel(sel)}</div>
    <div style=${{display:"flex",gap:"6px"}}>
     <button onClick=${()=>guard(()=>load(shiftKey(sel,-1)))} aria-label="전날">◀</button>
     <button onClick=${()=>guard(()=>load(shiftKey(sel,1)))} aria-label="다음날">▶</button>
    </div>
   </div>
   <div class="card">
    <div class="sum">
     <div><b>${sumEx}</b><span>운동 종목</span></div>
     <div><b>${sumSets}</b><span>총 세트</span></div>
     <div><b>${sumReps}</b><span>총 반복 횟수</span></div>
    </div>
   </div>
   <div class="card">
    <div class="hd"><div>운동 종목</div><div>세트별 횟수</div><div>세트 수</div><div>중량(kg)</div><div>메모</div><div></div></div>
    ${rows.length===0&&html`<div class="empty">운동이 없습니다. 아래 ‘운동 추가’를 눌러 시작하세요.</div>`}
    ${rows.map((r,i)=>html`<${Row} key=${r.id} r=${r} idx=${i} groups=${groups} upd=${upd} del=${del} addCustom=${addCustom}/>`)}
    <div class="acts">
     <button onClick=${addRow}>＋ 운동 추가</button>
    </div>
   </div>
   <div class="acts" style=${{alignItems:"center"}}>
    <button class="pri" onClick=${save}>저장하기</button>
    <button class="dng" disabled=${!hasSaved} onClick=${removeRecord}>기록 삭제</button>
   </div>
   ${dirty?html`<div class="dirty" style=${{marginTop:"8px"}}>${rows.some(r=>r.name)?"● 저장하는 중…":"● 운동 종목을 선택하면 자동으로 저장됩니다"}</div>`:autoAt&&html`<div class="hint">✓ 자동 저장됨 (${autoAt.getHours()}:${pad(autoAt.getMinutes())})</div>`}
  </div>`}
  ${toast&&html`<div class=${"toast"+(toast.err?" err":"")} role="status">${toast.msg}</div>`}
  ${pend&&html`<${RestoreModal} p=${pend} setP=${setPend} run=${runRestore}/>`}
  ${modal&&html`<${Modal} msg=${modal.msg} okText=${modal.okText} onOk=${modal.onOk} onCancel=${()=>setModal(null)}/>`}
 </div>`;
}
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
